<!DOCTYPE html>
<html lang="en">
<head>
    <script src="js/cadastro.js" defer></script>
    <meta charset="UTF-8">
    <title>Cadastro de Musicas</title>
</head>
<body>
<h1>Cadastro de Musicas</h1>
<hr>
<form id="musicForm" enctype="multipart/form-data">
    <p>
        <label for="titulo">Titulo:</label><br>
        <input type="text" id="titulo" name="titulo" style="width: 300px;"/>
    </p>
    <p>
        <label for="estilo">Estilo:</label><br>
        <select id="estilo" name="estilo" style="width: 300px;">
            <option value="">Carregando estilos...</option>
        </select>
    </p>
    <p>
        <label for="artista">Artista:</label><br>
        <input type="text" id="artista" name="artista" style="width: 300px;"/>
    </p>
    <p>
        <label for="arquivo">Arquivo MP3/OGG:</label><br>
        <input type="file" id="arquivo" name="arquivo"/>
    </p>
</form>
<button onclick="cadastrarMusica()">Cadastrar Musica</button>
</body>
</html>
