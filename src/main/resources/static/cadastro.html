<!DOCTYPE html>
<html lang="en">
<head>
    <script src="js/cadastro.js" defer></script>
    <meta charset="UTF-8">
    <title>Cadastro de Musicas</title>
</head>
<body>
<h1>Cadastro de Musicas</h1>
<hr>
<form enctype="multipart/form-data">
    <p><label for="titulo">Titulo:</label>

</form>
<button onclick="cadastrarMusica()">Cadastrar Musica</button>
</body>
</html>
