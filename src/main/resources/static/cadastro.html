<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <script src="js/cadastro.js" defer></script>
    <meta charset="UTF-8">
    <title>Cadastro de Musicas</title>
</head>
<body>
<header>
    <h1>PlayMySongs</h1>
    <nav>
        <a href="index.html">Início</a>
        <a href="buscamusica.html">Buscar Músicas</a>
    </nav>
</header>

<main>
    <h2>Cadastro de Músicas</h2>
    <form id="musicForm" enctype="multipart/form-data">
        <p>
            <label for="titulo">Título</label>
            <input type="text" id="titulo" name="titulo"/>
        </p>
        <p>
            <label for="estilo">Estilo</label>
            <select id="estilo" name="estilo">
                <option value="">Carregando estilos...</option>
            </select>
        </p>
        <p>
            <label for="artista">Artista</label>
            <input type="text" id="artista" name="artista"/>
        </p>
        <p>
            <label for="arquivo">Arquivo MP3/OGG</label>
            <input type="file" id="arquivo" name="arquivo"/>
        </p>
        <button onclick="cadastrarMusica()">Cadastrar Música</button>
    </form>
</main>
</body>
</html>
